[program:pos-queue]
command=php /var/www/pos/apps/api/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
user=www-data
autorestart=true
stopwaitsecs=3600

[program:pos-reverb]
command=php /var/www/pos/apps/api/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autorestart=true
minfds=10000
