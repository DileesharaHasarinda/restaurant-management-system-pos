name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [operations, website, desktop]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Typecheck / build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
          RESTAURANT_API_BASE_URL: https://api.example.com/api/v1
        run: |
          case "${{ matrix.app }}" in
            operations) npm run build ;;
            website) npm run build ;;
            desktop) npx tsc --noEmit && npx vite build -c vite.renderer.config.ts ;;
          esac
